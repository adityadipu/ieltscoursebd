<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Reading Mastery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0"
      }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Custom scrollbar for sidebar */
        aside::-webkit-scrollbar {
            width: 6px;
        }
        aside::-webkit-scrollbar-track {
            background: #881337; 
        }
        aside::-webkit-scrollbar-thumb {
            background: #be123c; 
            border-radius: 3px;
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          BookOpen, 
          CheckSquare, 
          List, 
          Clock, 
          Layout, 
          Target, 
          HelpCircle, 
          ChevronRight, 
          Menu, 
          X, 
          FileText, 
          Edit3,
          Columns,
          Image as ImageIcon,
          MousePointer,
          PieChart,
          ChevronDown,
          ChevronUp,
          AlertTriangle,
          ArrowLeft
        } from 'lucide-react';

        // --- Reusable Components ---

        const SectionHeader = ({ title, subtitle }) => (
          <div className="mb-6 border-b border-rose-100 pb-4">
            <h2 className="text-3xl font-bold text-rose-900">{title}</h2>
            {subtitle && <p className="text-gray-600 mt-2">{subtitle}</p>}
          </div>
        );

        const TipCard = ({ title, tips, extraContent }) => (
          <div className="bg-rose-50 border border-rose-100 rounded-xl p-6 mb-6 shadow-sm">
            <div className="flex items-center gap-2 mb-4">
              <div className="bg-rose-600 text-white p-2 rounded-lg">
                <Target size={20} />
              </div>
              <h3 className="text-xl font-bold text-rose-900">{title}</h3>
            </div>
            <ul className="space-y-3">
              {tips.map((tip, index) => (
                <li key={index} className="flex items-start gap-3 text-gray-700">
                  <span className="bg-rose-200 text-rose-800 text-xs font-bold px-2 py-1 rounded mt-1 min-w-[60px] text-center flex-shrink-0">
                    Tip {index + 1}
                  </span>
                  <span className="flex-1 whitespace-pre-wrap">{tip}</span>
                </li>
              ))}
            </ul>
            {extraContent && <div className="mt-4 pt-4 border-t border-rose-200 text-gray-700 whitespace-pre-wrap">{extraContent}</div>}
          </div>
        );

        const StrategyBox = ({ title, children, icon: Icon = Layout }) => (
          <div className="bg-white border border-gray-200 rounded-xl p-6 mb-6 shadow-sm hover:shadow-md transition-shadow">
            <h3 className="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
              <Icon size={18} className="text-rose-600" />
              {title}
            </h3>
            <div className="text-gray-600 leading-relaxed whitespace-pre-wrap">
              {children}
            </div>
          </div>
        );

        const CommonMistakes = ({ mistakes }) => (
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-6 mb-6 shadow-sm">
                <h3 className="text-lg font-bold text-amber-900 mb-3 flex items-center gap-2">
                    <AlertTriangle size={18} />
                    Common Mistakes / Traps
                </h3>
                <ul className="list-disc pl-5 space-y-2 text-amber-900">
                    {mistakes.map((m, i) => <li key={i}>{m}</li>)}
                </ul>
            </div>
        );

        const PracticeProblem = ({ title, passage, questions }) => {
          const [isOpen, setIsOpen] = useState(false);
          const [showAnswers, setShowAnswers] = useState(false);

          return (
            <div className="bg-white border border-gray-200 rounded-xl overflow-hidden mb-8 shadow-sm">
              <div 
                className="p-4 bg-gray-50 border-b border-gray-100 flex justify-between items-center cursor-pointer hover:bg-gray-100 transition-colors"
                onClick={() => setIsOpen(!isOpen)}
              >
                <h4 className="font-bold text-rose-900 text-lg">{title}</h4>
                {isOpen ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
              </div>
              
              {isOpen && (
                <div className="p-6">
                  <div className="mb-6 bg-slate-50 p-6 rounded-lg border border-slate-200 text-sm md:text-base leading-relaxed whitespace-pre-wrap font-serif text-gray-800">
                    {passage}
                  </div>

                  <div className="space-y-4">
                    <h5 className="font-bold text-gray-700 border-b pb-2">Questions</h5>
                    {questions.map((q, idx) => (
                      <div key={idx} className="mb-4 pb-4 border-b border-gray-100 last:border-0">
                        <p className="font-medium text-gray-800 mb-2 whitespace-pre-wrap">{q.question}</p>
                        {showAnswers && (
                          <div className="bg-rose-50 text-rose-800 p-3 rounded border border-rose-100 animate-fadeIn mt-2">
                            <span className="font-bold">Answer: </span>{q.answer}
                            {q.explanation && <p className="text-sm mt-1 text-gray-600 italic border-t border-rose-200 pt-1">Explanation: {q.explanation}</p>}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>

                  <button 
                    onClick={() => setShowAnswers(!showAnswers)}
                    className="mt-4 flex items-center gap-2 bg-rose-600 text-white px-4 py-2 rounded-lg hover:bg-rose-700 transition-colors shadow-sm"
                  >
                    {showAnswers ? "Hide Answers" : "Reveal Answers"}
                  </button>
                </div>
              )}
            </div>
          );
        };

        // --- Main Application Component ---

        function IeltsReadingApp() {
          const [activeSection, setActiveSection] = useState('overview');
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

          const navItems = [
            { id: 'overview', label: 'Overview & Strategies', icon: Layout },
            { id: 'matching-headings', label: 'Matching Headings', icon: List },
            { id: 'tfng', label: 'True / False / Not Given', icon: CheckSquare },
            { id: 'matching-paragraphs', label: 'Matching Paragraphs', icon: Columns },
            { id: 'summary-completion', label: 'Summary Completion', icon: Edit3 },
            { id: 'sentence-completion', label: 'Sentence Completion', icon: FileText },
            { id: 'multiple-choice', label: 'Multiple Choice', icon: MousePointer },
            { id: 'choosing-title', label: 'Choosing a Title', icon: Target },
            { id: 'categorisation', label: 'Categorisation', icon: PieChart },
            { id: 'sentence-ending', label: 'Match Sentence Ending', icon: FileText },
            { id: 'short-answer', label: 'Short Answer Qs', icon: HelpCircle },
            { id: 'list-selection', label: 'List Selection', icon: List },
            { id: 'table-completion', label: 'Table Completion', icon: Layout },
            { id: 'flowchart', label: 'Flowchart Completion', icon: Target },
            { id: 'diagram', label: 'Diagram Labeling', icon: ImageIcon },
          ];

          const renderContent = () => {
            switch (activeSection) {
              case 'overview':
                return (
                  <div className="animate-fadeIn">
                    <SectionHeader 
                      title="IELTS Reading Mastery" 
                      subtitle="Strategies, Traps & Rules derived from the Official Guide"
                    />
                    
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-8 mb-8">
                      <h3 className="text-rose-800 font-bold text-xl mb-6">1. Test Structure</h3>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                        <div className="p-4 bg-rose-50 rounded-lg">
                          <p className="font-bold text-2xl text-rose-600">40</p>
                          <p className="text-gray-600">Questions</p>
                        </div>
                        <div className="p-4 bg-rose-50 rounded-lg">
                          <p className="font-bold text-2xl text-rose-600">1</p>
                          <p className="text-gray-600">Mark/Question</p>
                        </div>
                        <div className="p-4 bg-rose-50 rounded-lg">
                          <p className="font-bold text-2xl text-rose-600">3</p>
                          <p className="text-gray-600">Reading Passages</p>
                        </div>
                        <div className="p-4 bg-rose-50 rounded-lg">
                          <p className="font-bold text-2xl text-rose-600">60</p>
                          <p className="text-gray-600">Minutes</p>
                        </div>
                      </div>
                    </div>

                    <div className="grid md:grid-cols-2 gap-6">
                      <StrategyBox title="2. Important Mindset">
                        <ul className="list-disc pl-5 space-y-2">
                          <li>It's not necessary to comprehend every word.</li>
                          <li>The goal is to find the correct answer.</li>
                        </ul>
                      </StrategyBox>
                      
                      <StrategyBox title="3. Time Management" icon={Clock}>
                        <ul className="list-disc pl-5 space-y-2">
                          <li>Must manage own time.</li>
                          <li>Start with any passage.</li>
                          <li>Move between passages and questions freely.</li>
                        </ul>
                      </StrategyBox>

                      <StrategyBox title="4. Key recording skills">
                        <ul className="space-y-3">
                          <li><strong>Skimming:</strong> Read quickly to understand the main idea of the passage.</li>
                          <li><strong>Scanning:</strong> Look for specific words, numbers, information, or names.</li>
                          <li><strong>Analysis:</strong> Read carefully where the answer is located to choose the correct meaning.</li>
                        </ul>
                      </StrategyBox>

                      <StrategyBox title="6. Biggest challenge" icon={Target}>
                        <ul className="list-disc pl-5 space-y-2">
                          <li>Time management.</li>
                          <li>Paraphrasing & Vocabulary.</li>
                          <li>Finding the right part of the passage.</li>
                          <li>Understanding what the question is really asking for.</li>
                        </ul>
                      </StrategyBox>
                    </div>
                    <div className="mt-6 p-4 bg-gray-100 rounded text-center text-gray-600">
                        5. Question Type: 12-14 different question types.
                    </div>
                  </div>
                );

              case 'matching-headings':
                return (
                  <div className="animate-fadeIn">
                    <SectionHeader title="Matching Headings" subtitle="Match each paragraph with headings that best summarises its main idea, not small details." />
                    
                    <div className="mb-6 p-4 bg-blue-50 border-l-4 border-blue-500">
                        <p><strong>Task:</strong> Match each paragraph with headings that best summarises its main idea, not small details.</p>
                        <p><strong>Concept:</strong> Not testing understanding of details. It tests whether you can identify the main idea of each paragraph.</p>
                        <p>A heading = A title. A paragraph = A mini article with one main idea.</p>
                    </div>

                    <TipCard 
                      title="13 Essential Tips"
                      tips={[
                        "Read the passage or heading first.\n- Headings first: If you want to know about the ideas to look for.\n- Paragraphs first: If you prefer understanding before choosing.",
                        "In a computer test, Headings & Passages are side by side.",
                        "Count headings & paragraphs.\n- Usually more headings than paragraphs.\n- Remove distractor headings.",
                        "One paragraph, one heading.",
                        "Heading describe the AIM of the paragraph.\n- NOT: Finding similar words/sentences.\n- For: What the whole paragraph is trying to do.\n- Ask: Why did the writer write this paragraph?",
                        "Be careful with similar headings.\n- Example: Cause of climate change vs Effect of climate change.\n- Same topic, different focus.",
                        "Paraphrasing is key.\n- Example: 'Problem caused by urban growth' vs 'Cities expanding too quickly...'.\n- Look for ideas, not vocabulary matches.",
                        "Read the paragraph for the main ideas. Don't read word by word.\n- Focus: Pay attention to the first 1-2 sentences. Overall direction of the paragraph.",
                        "Separate main ideas from extra details.\n- A paragraph often includes: Examples, Statistics, Explanations.\n- These are supporting details, not main ideas. Ignore details unless they reveal the paragraph's purpose.",
                        "A heading may be part of the paragraph but still be wrong. Some headings match one sentence only.",
                        "Not all headings will be used.",
                        "The answer must be in Roman numerals (I, II, III, IV, etc.). Not A, B, C or 1, 2, 3.",
                        "Manage your time. Don't spend too much on one paragraph. If unsure: Skip. Come back later."
                      ]}
                      extraContent="Strategy: Read paragraph &rarr; Identify the main idea &rarr; check the heading, eliminate the wrong one &rarr; choose the best &rarr; move on."
                    />

                    <h3 className="text-xl font-bold text-gray-800 mb-4">Practice Problems</h3>
                    
                    <PracticeProblem 
                      title="Prob 01: The Greenhouse Effect"
                      passage={`Reading Passage: The Greenhouse Effect\nChoose the correct heading (I-IX) for paragraphs A, B, C and D.\n\n[Headings List]\nI Changing temperatures\nII The greenhouse\nIII Global warming\nIV Use of a greenhouse\nV Werne's research\nVI Earth's atmosphere\nVII Our choices\nVIII Effects of carbon dioxide\nIX Climates around the world\n\nA.\nA greenhouse is a house made entirely of glass: both walls and roof are glass. One of the main purposes of a greenhouse is to grow tomatoes, flowers and other plants that might struggle to grow outside. A greenhouse stays warm inside, even during winter. Sunlight shines in and warms the plants and air inside. But the heat is trapped by the glass and cannot escape. So during the daylight hours, it gets warmer and warmer inside a greenhouse, and stays quite warm at night too.\n\nB.\nThe Earth experiences a similar thing to a greenhouse. Gases in the atmosphere such as carbon dioxide do what the roof of a greenhouse does. During the day, the Sun shines through the atmosphere. Earth's surface warms up in the sunlight. At night, Earth's surface cools, releasing the heat back into the air. But some of the heat is trapped by the greenhouse gases in the atmosphere. That is what keeps our Earth a warm and comfortable 59 degrees Fahrenheit, on average.\n\nC.\nHowever, gas molecules, called greenhouse gases, which absorb thermal infrared radiation, are rising and this is what is altering the climate system. Carbon dioxide (CO2) and other greenhouse gases act like a blanket, absorbing IR radiation and preventing it from escaping into outer space. The greenhouse effect, combined with increasing levels of greenhouse gases, produces climate change on a global scale, which is expected to have profound implications for all countries around the world.\n\nD.\nMany scientists agree that the damage to the Earth's atmosphere and climate is past the point of no return or that the damage is near the point of no return. In Josef Werne's opinion, an associate professor at the department of geology & planetary science at the University of Pittsburgh told Live Science, we have three ways to move forward. Firstly to do nothing and live with the consequences. Secondly, to adapt to the changing climate (which includes things like rising sea level and related flooding protection). Thirdly, mitigate the impact of climate change by aggressively enacting policies that actually reduce the concentration of CO2 in the atmosphere.`}
                      questions={[
                        { question: "Paragraph A", answer: "II (The greenhouse)", explanation: "The best title is 'The greenhouse' because it gave a clear overview of it. It can't be IV because uses were additional info, not the main aim. It can't be I because temperatures were only illustrative." },
                        { question: "Paragraph B", answer: "VI (Earth's atmosphere)", explanation: "Explains how Earth's atmosphere works to keep our planet at a stable temperature. It isn't I because the paragraph explains this natural effect keeps temperature stable." },
                        { question: "Paragraph C", answer: "III (Global warming)", explanation: "It isn't VIII (Effects of carbon dioxide) because it mentions it alongside others. It isn't IX (Climates around the world) because the aim isn't to discuss different countries." },
                        { question: "Paragraph D", answer: "VII (Our choices)", explanation: "Discusses 'three ways to move forward' (choices). It isn't V because it discusses his opinions, not his research methodology." }
                      ]}
                    />

                    <PracticeProblem 
                      title="Prob 02: The History of Pasta"
                      passage={`Reading Passage: The History of Pasta\nChoose the correct heading (I-VIII) for paragraphs A, B, C and D.\n\n[Headings List]\nI. A theory dismissed\nII. Marco Polo in China\nIII. Is pasta really a popular Italian dish?\nIV. China is the origin of pasta\nV. The real roots\nVI. An Arab taste sensation\nVII. The common belief of the origins of pasta\nVIII. How about China?\n\nParagraph A: Worldwide, pasta has become synonymous with Italian cuisine. Italian immigrants themselves brought pasta everywhere they went. While it is true that the most famous varieties and recipes of cooking pasta really do come from Italy, surprisingly, the actual origin of pasta lies elsewhere!\n\nParagraph B: One of the more popular theories of the arrival of pasta in Italy was published in the 'Macaroni Journal' by the Association of Food Industries. It states that pasta was brought to Italy by Marco Polo via China. Polo ventured to China in the time of the Yuan Dynasty (1271-1368) and the Chinese had been consuming noodles as early as 3000 B.C. in the Qinghai province. There is even some evidence there of 4,000-year-old noodles made from foxtail and broomcorn millet.\n\nParagraph C: Unfortunately, there are problems with this theory, least of which is that the noodles they were making in China aren't technically considered pasta. Polo also described Chinese noodles as being like 'lagana', which implies he was possibly already familiar with a pasta-like food before going to China. Further, in 1279, there was a Italian Genoese soldier that listed in the inventory of his estate a basket of dried pasta. However, Polo did not come back from China until 1295. Furthermore, the modern pasta we know today was first described in 1154 by an Arab geographer, Idrisi, as being common in Sicily. So Marco Polo could not have brought pasta to Italy via China. It was already in Italy at that time.\n\nParagraph D: Most food historians believe that Arabs (specifically from Libya) are to be credited for bringing pasta, along with spinach, eggplant and sugar cane, to the Mediterranean. In the Talmud, written in Aramaic in the 5th century AD, there is a reference to pasta being cooked by boiling. It is thought, then, that pasta was introduced to Italy during the Arab conquests of Sicily in the 9th century AD, which had the interesting side effect of drastically influencing the region's cuisine. It also known that by the 12th century, the Italians had learned from the Arabs methods for drying pasta to preserve it while traveling. Further support for this theory can be found by the fact that, in many old Sicilian pasta recipes, there are Arab gastronomic introductions. One example of cross cultural recipes is Barida, which is an old Arab recipe with Roman clear roots.`}
                      questions={[
                        { question: "Paragraph A", answer: "VII (The common belief of the origins of pasta)", explanation: "NOTE: The PDF text Answer Key says A = VII. It opens up the topic of where pasta really comes from. It isn't V (The real roots) because it just introduces the idea that it isn't Italy." },
                        { question: "Paragraph B", answer: "VIII (How about China?)", explanation: "This paragraph offers yet another common belief which is that pasta comes from China. It fits the aim." },
                        { question: "Paragraph C", answer: "I (A theory dismissed)", explanation: "This paragraph is all about dismissing the theory that was introduced in the previous paragraph." },
                        { question: "Paragraph D", answer: "V (The real roots)", explanation: "The paragraph really does talk about the origin of pasta. 'Roots' refers to origin. 'Arab taste sensation' is wrong because it gives no description of flavour." }
                      ]}
                    />

                     <PracticeProblem 
                      title="Prob 03: Antimicrobial Resistance"
                      passage={`[Headings List]\ni. A fatal threat\nii. A global concern\niii. The evolution of resistance\niv. MRSA in hospitals\nv. The present situation\nvi. What is antimicrobial resistance?\nvii. Protecting future generations\n\nA) While antibiotic resistance refers specifically to the resistance to antibiotics that occurs in common bacteria that cause infections, antimicrobial resistance is a broader term, encompassing resistance to drugs to treat infections caused by other microbes. Antimicrobial resistance (AMR) is resistance of microorganisms to an antimicrobial drug that was originally effective for treatment of infections caused by it. Resistant microorganisms (including bacteria, fungi, viruses and parasites) are able to withstand attack by antimicrobial drugs... The evolution of resistant strains is a natural phenomenon... The use and misuse of antimicrobial drugs accelerates the emergence of drug-resistant strains. Poor infection control practices, inadequate sanitary conditions and inappropriate food-handling encourages the further spread of AMR.\n\nB) New resistance mechanisms emerge and spread worldwide threatening our ability to treat common infectious diseases, resulting in death and disability of individuals who until recently could continue a normal course of life. Without effective anti-infective treatment, many standard medical treatments will fail or turn very high risk procedures. This would be a financially draining situation for wealthy countries but for the poorer ones, it could have catastrophic effects.\n\nC) Infections caused by resistant microorganisms often fail to respond to the standard treatment, resulting in prolonged illness, higher health care expenditures, and a greater risk of death. As an example, the death rate for patients with serious infections caused by common bacteria treated in hospitals can be about twice that of patients with infections caused by the same non-resistant bacteria. For example, people with MRSA... are estimated to be 64% more likely to die than people with a non-resistant form of the infection.\n\nD) WHO's report on global surveillance of antimicrobial resistance reveals that antibiotic resistance is no longer a prediction of the future; it is happening right now, across the world, and is putting at risk the achievement of modern medicine in both the community and hospitals. Without urgent, coordinated action, the world is heading towards a post-antibiotic era, in which common infections and minor injuries, which have been treatable for decades, can once again kill.`}
                      questions={[
                        { question: "Section A", answer: "VI (What is antimicrobial resistance?)", explanation: "Defines the term and scope." },
                        { question: "Section B", answer: "II (A global concern)", explanation: "Mentions 'spread worldwide' and 'threatening our ability'." },
                        { question: "Section C", answer: "I (A fatal threat)", explanation: "Mentions 'greater risk of death' and examples of death rates." },
                        { question: "Section D", answer: "V (The present situation)", explanation: "Mentions 'happening right now'." }
                      ]}
                    />

                     <PracticeProblem 
                      title="Prob 04: Pangolins"
                      passage={`[Headings List]\ni) The Asian pangolin\nii) Distribution and habitat\niii) Pangolin behaviour\niv) Taxonomy\nv) Pangolin burrows\nvi) The pangolin trade\nvii) Comparison of pangolin species\nviii) What is a pangolin?\nix) Description of a pangolin\nx) Why pangolins are endangered\nxi) The pangolin diet\n\nA) Pangolins, often called "scaly anteaters," are covered in tough, overlapping scales. These burrowing mammals eat ants and termites using an extraordinarily long, sticky tongue, and are able to quickly roll themselves up into a tight ball when threatened. Eight different pangolin species can be found across Asia and sub-Saharan Africa. Poaching for illegal wildlife trade and habitat loss have made these incredible creatures one of the most endangered groups of mammals in the world.\n\nB) Pangolin species vary in size from about 1.6kg to a maximum of about 33kg. They vary in color from light to yellowish brown through olive to dark brown. Protective, overlapping scales cover most of their bodies. These scales are made from keratin - the same protein that forms human hair and fingernails. Overlapping like artichoke leaves, the scales grow throughout the life of a pangolin just like hair... Pangolin undersides do not have scales... Pangolins have poor vision, so they locate termite and ant nests with their strong sense of smell.\n\nC) There are eight pangolin species. All pangolins belong to the genus Manis in the family Manidae, which is the only family within the order Pholidota. Pangolins' closest living relatives are the Xenarthrans - anteaters, armadillos, and sloths.\n\nD) Pangolins are found in a variety of habitats including tropical and flooded forests, thick brush, cleared and cultivated areas, and savanna grassland; in general they occur where large numbers of ants and termites are found. Asian pangolins in particular are threatened by loss of habitat... Pangolins dig deep burrows for sleeping and nesting...\n\nE) These solitary mammals are nocturnal and highly secretive, thus it is difficult for scientists to study them in the wild, and many mysteries remain about their habits. Some pangolin species... sleep in underground burrows... others... sleep in trees. They emerge in the evening to forage for insects. Pangolins are well adapted for digging... When threatened, pangolins can quickly curl into a ball...\n\nF) Pangolins live predominantly on a diet of ants and termites, which they may supplement with various other invertebrates including bee larvae, flies, worms, earthworms, and crickets. This specialized diet makes them extremely difficult to maintain in captivity... Wild pangolins locate insect nests using a well developed sense of smell.\n\nG) Pangolins are hunted for food, for use in traditional medicine and as fashion accessories, and for a rampant illegal international trade in scales, skins, and meat. There is high demand for nearly all of their body parts, primarily from China. The large-scale illegal trade in Asian pangolins is drastically driving down their numbers throughout Southeast Asia. Rapid loss and deterioration of available habitat places added pressure on the dwindling numbers of remaining pangolins.`}
                      questions={[
                        { question: "Section A", answer: "VIII (What is a pangolin?)" },
                        { question: "Section B", answer: "IX (Description of a pangolin)" },
                        { question: "Section C", answer: "IV (Taxonomy)" },
                        { question: "Section D", answer: "II (Distribution and habitat)" },
                        { question: "Section E", answer: "III (Pangolin behaviour)" },
                        { question: "Section F", answer: "XI (The pangolin diet)" },
                        { question: "Section G", answer: "X (Why pangolins are endangered)" },
                      ]}
                    />
                     <PracticeProblem 
                      title="Prob 05: Desertification Causes and Effects"
                      passage={`[Headings List]\nI Overgrazing\nII Mass migration\nIII Overpopulation\nIV Polluted drinking water\nV Famine\nVI Extinction of species\nVII Deforestation\nVIII Poverty\nIX Unsustainable agriculture techniques\nX Soil infertility\n\nReading Passage: Desertification Causes and Effects\n\nCauses of Desertification\n\nA. Trees are being cut down at much larger scale than ever before to be used as fuel, to provide products we use in our daily life, or to simply create more space for agriculture to sustain growing human population. Once the trees and other vegetation in an area are gone, there is nothing left to hold the soil in place.\n\nB. Our planet's ecosystems sustain life only when balanced. They can cope with incremental challenges and adapt but beyond a certain tipping point they collapse. A rapid increase in the number of people demands higher amounts of natural resources and expands more and more over the landscape, leading to increased desertification.\n\nC. Improper irrigation methods used in arid areas, such as canal irrigation, lead to a buildup of salt in the soil and make it difficult for crops and other plants to grow, increasing desertification. Similarly harmful is cultivation of already deteriorated lands. Through inconsiderate farming methods, farmers only speed up the process of desertification in exchange for poor quality crops with low economic value.\n\nD. In arid regions, grass and other vegetation is necessary to keep the soil in place. If such vegetation is used as feed for cattle without sustainable control, there is nothing that remains to prevent soil from blowing or washing away, and if this process occurs long enough, it can lead to desertification.\n\nEffects of Desertification\n\nE. As desertification occurs, the soil can be blown or washed away, and valuable soil nutrients are lost. As the soil dries out, it hardens and it becomes difficult for rainwater and floods to penetrate below the soil's surface. And what remains left is a lifeless pile of dust instead of a life-giving medium.\n\nF. Due to drought conditions and a loss of productive land, local people find themselves and their livestock experiencing starvation.\n\nG. Desertification events have been a major driver behind the movement of large human populations throughout history. When soils are not able to support their civilisation, people set on the move to look for better locations.\n\nH. Species that once lived in a fertile and productive climate may not survive in a newly desertified region.`}
                      questions={[
                        { question: "Paragraph A", answer: "VII (Deforestation)" },
                        { question: "Paragraph B", answer: "III (Overpopulation)" },
                        { question: "Paragraph C", answer: "IX (Unsustainable agriculture techniques)" },

st, let's look at the germinal disc. It's a small, circular, white spot (2-3 mm across) on the surface of the yolk; it is where the sperm enters the egg. The nucleus of the egg is in the blastodisc. The embryo develops from this disk, and gradually sends blood vessels into the yolk to use it for nutrition as the embryo develops."
